<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>هد لاین Pro — مشاور فوق‌کوانتومی مدل مو</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap');

  :root{
    --p:#8b6f4e;--pd:#6d5640;--pl:#a98a68;--bg:#f5f2ee;--sf:#fff;
    --tx:#2c2c2c;--mu:#888;--bd:#e5e0d8;--er:#c0392b;--erb:#fdecea;
    --qu:#5b3fa8;--qub:#e8e3f7;--qug:#7c5fd3;
    --ok:#16a34a;--okb:#dcfce7;--warn:#d97706;--warnb:#fef3c7;
    --r:14px;--r2:8px;--sh:0 4px 20px rgba(139,111,78,.10);
    --grad:linear-gradient(135deg,#8b6f4e 0%,#a98a68 100%);
    --gradq:linear-gradient(135deg,#5b3fa8 0%,#7c5fd3 50%,#a78bfa 100%);
    --gradq2:linear-gradient(90deg,#5b3fa8,#7c5fd3,#a78bfa,#7c5fd3,#5b3fa8);
    --grid-line:rgba(139,111,78,.06);
    --glow-gold:rgba(139,111,78,.15);
    --glow-purple:rgba(124,95,211,.10);
    --stroke:rgba(139,111,78,.10);
    --bracket:rgba(139,111,78,.45);
    --bracket2:rgba(124,95,211,.45);
  }
  [data-theme="dark"]{
    --bg:#060608;--sf:#111114;--tx:#f0f0f0;--mu:#999aa3;--bd:#25252c;
    --erb:#2a0f0c;--qub:#1f1832;--okb:#0c2114;--warnb:#2a1e08;
    --sh:0 4px 24px rgba(0,0,0,.55);
    --grid-line:rgba(139,111,78,.045);
    --glow-gold:rgba(139,111,78,.20);
    --glow-purple:rgba(124,95,211,.18);
    --stroke:rgba(139,111,78,.18);
    --bracket:rgba(139,111,78,.55);
    --bracket2:rgba(124,95,211,.55);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}

  /* ═══════════ ✦ پس‌زمینه مهندسی مشکی HEADLINE ✦ ═══════════ */
  body{
    margin:0;min-height:100dvh;background-color:var(--bg);color:var(--tx);
    font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.65;padding:16px 16px 32px;
    background-image:
      radial-gradient(circle 900px at 12% 0%, var(--glow-gold) 0%, transparent 55%),
      radial-gradient(circle 800px at 90% 100%, var(--glow-purple) 0%, transparent 55%),
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:auto,auto,44px 44px,44px 44px;
    background-attachment:fixed;
    transition:background-color .4s,color .4s;
    position:relative;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  [data-theme="dark"] body{
    background-image:
      radial-gradient(circle 900px at 12% 0%, var(--glow-gold) 0%, transparent 55%),
      radial-gradient(circle 800px at 90% 100%, var(--glow-purple) 0%, transparent 55%),
      radial-gradient(circle 700px at 50% 50%, rgba(91,63,168,.07) 0%, transparent 70%),
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(rgba(124,95,211,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,95,211,.025) 1px, transparent 1px);
    background-size:auto,auto,auto,48px 48px,48px 48px,12px 12px,12px 12px;
  }

  /* ─── واترمارک OUTLINE لوکس HEADLINE ─── */
  body::before{
    content:"HEADLINE";
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(-12deg);
    font-size:17vw;font-weight:900;line-height:1;
    color:transparent;
    -webkit-text-stroke:1.5px var(--stroke);
    letter-spacing:1.4vw;
    z-index:0;pointer-events:none;white-space:nowrap;
    font-family:'Arial Black','Segoe UI Black',Arial,sans-serif;
    user-select:none;
    text-shadow:0 0 100px rgba(139,111,78,.10);
  }
  [data-theme="dark"] body::before{
    -webkit-text-stroke:1.5px rgba(139,111,78,.16);
    text-shadow:0 0 120px rgba(124,95,211,.15), 0 0 60px rgba(139,111,78,.12);
  }

  /* ─── کانتینر با براکت‌های مهندسی ─── */
  .container{max-width:580px;margin:0 auto;position:relative;z-index:1}
  .container::before,
  .container::after{
    content:"";position:absolute;width:36px;height:36px;
    pointer-events:none;z-index:0;opacity:.85;
    transition:opacity .3s;
  }
  .container::before{
    top:-8px;left:-8px;
    border-top:2px solid var(--bracket);
    border-left:2px solid var(--bracket);
  }
  .container::after{
    bottom:-8px;right:-8px;
    border-bottom:2px solid var(--bracket2);
    border-right:2px solid var(--bracket2);
  }

  /* ═══════════ Header ═══════════ */
  .header{text-align:center;margin-bottom:20px;position:relative;padding:14px 0 18px}
  .header::after{
    content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:55%;height:1px;
    background:linear-gradient(90deg,transparent,var(--p),var(--qu),var(--p),transparent);
    opacity:.55;
  }
  h1{margin:0;font-size:2.5rem;font-weight:900;line-height:1;
     background:var(--gradq);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
     background-clip:text;letter-spacing:-1px;
     animation:titleGlow 4s ease-in-out infinite alternate}
  @keyframes titleGlow{
    0%{filter:drop-shadow(0 0 6px rgba(124,95,211,.20))}
    100%{filter:drop-shadow(0 0 18px rgba(124,95,211,.45))}
  }
  .h1-en{display:block;font-size:.82rem;font-weight:600;color:var(--mu);
     letter-spacing:8px;margin-top:6px;-webkit-text-fill-color:var(--mu);
     text-indent:8px}
  .h1-sub{display:block;font-size:.7rem;color:var(--qu);letter-spacing:3px;margin-top:4px;font-weight:700}

  /* Theme toggle */
  .theme-btn{position:absolute;top:8px;inset-inline-end:0;width:40px;height:40px;
     border-radius:50%;background:var(--sf);border:1px solid var(--bd);cursor:pointer;
     font-size:1.1rem;display:grid;place-items:center;box-shadow:var(--sh);
     transition:transform .2s,background .2s;z-index:10;color:var(--tx)}
  .theme-btn:active{transform:scale(.92)}
  [data-theme="dark"] .theme-btn{border-color:rgba(139,111,78,.3)}

  /* ═══════════ Instruction ═══════════ */
  .instruction{padding:14px 18px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);
     -webkit-backdrop-filter:blur(14px);
     border-right:4px solid var(--pl);border-radius:var(--r2);font-size:.88rem;margin-bottom:14px;
     box-shadow:var(--sh);line-height:1.7}
  [data-theme="dark"] .instruction{background:rgba(17,17,20,.75);border-right-color:var(--p)}

  /* ═══════════ Buttons ═══════════ */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
     border:none;border-radius:var(--r);font-family:inherit;font-size:1rem;font-weight:700;
     cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;
     position:relative;overflow:hidden;letter-spacing:-.2px}
  .btn:active:not(:disabled){transform:scale(.985)}
  .btn:disabled{background:var(--bd);color:var(--mu);cursor:not-allowed;opacity:.7}
  .btn--primary{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(139,111,78,.35)}
  .btn--primary:hover:not(:disabled){box-shadow:0 6px 24px rgba(139,111,78,.5)}
  .btn--secondary{background:var(--sf);color:var(--p);border:1.5px solid var(--p)}
  .btn--secondary:hover{background:var(--p);color:#fff}
  .btn--ghost{background:transparent;color:var(--mu)}
  .btn--ghost:hover{color:var(--p)}
  .btn--quantum{background:var(--gradq);color:#fff;
     box-shadow:0 4px 20px rgba(91,63,168,.4),inset 0 1px 0 rgba(255,255,255,.15)}
  .btn--quantum:hover:not(:disabled){box-shadow:0 6px 28px rgba(91,63,168,.6)}
  .actions{display:flex;flex-direction:column;gap:10px}
  .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

  /* ═══════════ Preview ═══════════ */
  .preview{display:none;position:relative;border-radius:var(--r);overflow:hidden;
     margin-bottom:14px;box-shadow:var(--sh);background:#000;
     border:1px solid rgba(139,111,78,.15)}
  .preview.is-visible{display:block;animation:slideIn .3s ease-out}
  .preview img{display:block;width:100%;max-height:340px;object-fit:cover}
  .preview canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
  .preview__remove{position:absolute;top:8px;inset-inline-start:8px;width:36px;height:36px;
     padding:0;border:none;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;
     font-size:18px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);z-index:2}
  .preview__badge{position:absolute;top:8px;inset-inline-end:8px;padding:5px 12px;
     background:rgba(91,63,168,.9);color:#fff;font-size:.7rem;font-weight:800;
     border-radius:999px;backdrop-filter:blur(6px);letter-spacing:.5px;
     box-shadow:0 2px 12px rgba(91,63,168,.5)}

  /* ═══════════ Loading ═══════════ */
  .loading{display:none;text-align:center;padding:32px 20px;
     background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
     border-radius:var(--r);box-shadow:var(--sh);
     border:1px solid rgba(139,111,78,.12)}
  [data-theme="dark"] .loading{background:rgba(17,17,20,.85)}
  .loading.is-visible{display:block;animation:fadeIn .3s}
  .spinner{width:52px;height:52px;margin:0 auto 18px;position:relative}
  .spinner::before,.spinner::after{content:"";position:absolute;inset:0;border-radius:50%;
     border:3px solid transparent}
  .spinner::before{border-top-color:var(--qu);animation:spin .8s linear infinite}
  .spinner::after{border-bottom-color:var(--qug);animation:spin 1.2s linear infinite reverse;inset:4px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .progress{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:0 0 14px;position:relative}
  .progress__fill{height:100%;background:var(--gradq);width:0%;border-radius:3px;
     transition:width .4s ease;position:relative;overflow:hidden}
  .progress__fill::after{content:"";position:absolute;inset:0;
     background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
     animation:shimmer 1.5s infinite}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  #loading-text{margin:0;color:var(--qu);font-weight:700;font-size:.9rem;min-height:1.4em}
  [data-theme="dark"] #loading-text{color:var(--qug)}

  /* ═══════════ Alerts ═══════════ */
  .alert{display:none;padding:12px 16px;border-radius:var(--r2);font-size:.88rem;margin-top:12px}
  .alert.is-visible{display:block;animation:slideIn .3s}
  .alert--error{background:var(--erb);color:var(--er);border-right:4px solid var(--er)}
  .alert--warn{background:var(--warnb);color:var(--warn);border-right:4px solid var(--warn)}

  /* ═══════════ Cards ═══════════ */
  .result{display:none;margin-top:14px}
  .result.is-visible{display:block;animation:slideIn .4s}
  .card{background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
     -webkit-backdrop-filter:blur(14px);
     border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:14px;
     border:1px solid rgba(139,111,78,.10);position:relative}
  [data-theme="dark"] .card{background:rgba(17,17,20,.82);border-color:rgba(139,111,78,.10)}

  .result__shape{text-align:center;padding-bottom:14px;margin-bottom:14px;
     border-bottom:1px solid var(--bd)}
  .result__shape-label{display:block;font-size:.82rem;color:var(--mu)}
  .result__shape-value{display:block;font-size:2.4rem;font-weight:900;color:var(--p);
     margin-top:4px;letter-spacing:-1.5px;line-height:1.2}
  .result__shape-en{display:block;font-size:.8rem;color:var(--mu);margin-top:2px;
     letter-spacing:2px;text-transform:uppercase}

  /* Confidence */
  .conf{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0 14px}
  .conf__bar{flex:0 0 180px;height:10px;background:var(--bd);border-radius:5px;
     overflow:hidden;position:relative}
  .conf__fill{height:100%;background:var(--grad);border-radius:5px;
     transition:width 1.2s cubic-bezier(.4,0,.2,1)}
  .conf__pct{font-size:.88rem;color:var(--mu);font-weight:800;font-variant-numeric:tabular-nums}

  /* ═══════════ Quantum box ═══════════ */
  .quantum-box{background:linear-gradient(135deg,rgba(244,240,255,.9) 0%,rgba(255,255,255,.9) 100%);
     border:1px solid var(--qub);border-radius:10px;padding:14px 16px;margin:12px 0;
     position:relative;overflow:hidden}
  [data-theme="dark"] .quantum-box{background:linear-gradient(135deg,rgba(31,24,50,.85) 0%,rgba(17,17,20,.9) 100%)}
  .quantum-box::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
     background:var(--gradq2);background-size:200% 100%;animation:quantumFlow 3s linear infinite}
  @keyframes quantumFlow{0%{background-position:0% 0}100%{background-position:200% 0}}
  .quantum-box__title{font-size:.75rem;color:var(--qu);font-weight:800;margin-bottom:12px;
     letter-spacing:.04em;display:flex;align-items:center;gap:6px}
  [data-theme="dark"] .quantum-box__title{color:var(--qug)}
  .quantum-box__title::before{content:"⚛";font-size:1rem;animation:spin 4s linear infinite}
  .quantum-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .qm{display:flex;flex-direction:column;gap:2px}
  .qm__label{font-size:.7rem;color:var(--mu)}
  .qm__val{font-size:.95rem;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums}
  .qm__val--qu{color:var(--qu)}
  [data-theme="dark"] .qm__val--qu{color:var(--qug)}
  .qm__val--ok{color:var(--ok)}
  .qm__val--warn{color:var(--warn)}

  /* Probability chart */
  .prob-chart{margin:14px 0 4px;padding-top:12px;border-top:1px dashed var(--bd)}
  .prob-chart__title{font-size:.75rem;color:var(--mu);font-weight:700;margin-bottom:10px}
  .prob-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:.8rem}
  .prob-label{width:56px;color:var(--mu);font-weight:500}
  .prob-bar{flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden;position:relative}
  .prob-fill{height:100%;background:var(--grad);border-radius:4px;width:0;
     transition:width 1.1s cubic-bezier(.4,0,.2,1)}
  .prob-pct{width:48px;text-align:left;font-variant-numeric:tabular-nums;
     color:var(--mu);font-weight:700;font-size:.72rem}
  .prob-row--top .prob-fill{background:var(--gradq)}
  .prob-row--top .prob-pct{color:var(--qu);font-weight:900}
  [data-theme="dark"] .prob-row--top .prob-pct{color:var(--qug)}
  .prob-row--top .prob-label{color:var(--qu);font-weight:800}
  [data-theme="dark"] .prob-row--top .prob-label{color:var(--qug)}

  /* ═══════════ Prefs ═══════════ */
  .prefs{margin:16px 0}
  .prefs__row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .prefs__label{font-size:.82rem;color:var(--mu);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 12px;border:1.5px solid var(--bd);background:var(--sf);
     border-radius:999px;font-family:inherit;font-size:.78rem;color:var(--tx);
     cursor:pointer;transition:all .15s;font-weight:600}
  .chip:hover{border-color:var(--pl);transform:translateY(-1px)}
  .chip--active{background:var(--p);border-color:var(--p);color:#fff;font-weight:700;
     box-shadow:0 2px 10px rgba(139,111,78,.4)}

  /* ═══════════ Style cards ═══════════ */
  .result__title{margin:16px 0 12px;font-weight:800;display:flex;justify-content:space-between;
     align-items:center;font-size:.95rem}
  .result__count{font-size:.8rem;color:var(--mu);font-weight:500}

  .style-card{display:flex;gap:12px;padding:12px;background:var(--bg);border-radius:10px;
     margin-bottom:10px;border:1px solid transparent;transition:all .2s;
     animation:slideIn .35s ease-out both;align-items:center}
  [data-theme="dark"] .style-card{background:rgba(30,30,36,.55)}
  .style-card:hover{border-color:var(--pl);box-shadow:var(--sh);transform:translateY(-1px)}

  .style-img{width:70px;height:70px;border-radius:8px;object-fit:cover;flex-shrink:0;
     box-shadow:0 2px 8px rgba(0,0,0,0.15);border:1px solid rgba(139,111,78,.15)}

  .style-body{flex:1;min-width:0}
  .style-title{font-size:.95rem;font-weight:800}
  .style-title-en{font-size:.75rem;color:var(--mu);font-weight:500;margin-inline-start:4px}
  .style-why{font-size:.78rem;color:var(--qu);margin:4px 0 0;font-weight:600}
  [data-theme="dark"] .style-why{color:var(--qug)}
  .style-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .tag{font-size:.7rem;padding:3px 9px;background:var(--sf);border:1px solid var(--bd);
     border-radius:999px;color:var(--mu);font-weight:600}
  .tag--diff{color:#b45309;border-color:#fde68a;background:#fffbeb}
  .tag--maint{color:var(--ok);border-color:#bbf7d0;background:var(--okb)}
  .tag--img{background:#e8f0fe;color:#1a73e8;border-color:#a8c7fa;
     text-decoration:none;display:inline-block;cursor:pointer;font-weight:700}
  .tag--img:hover{background:#d2e3fc}
  .tag--fav{background:var(--warnb);color:var(--warn);border-color:#fde68a;cursor:pointer;font-weight:700}
  .tag--fav.is-active{background:var(--warn);color:#fff;border-color:var(--warn)}

  .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .empty{padding:28px;text-align:center;color:var(--mu);font-size:.9rem}

  /* ═══════════ Footer ═══════════ */
  .footer{text-align:center;margin-top:36px;font-size:.75rem;color:var(--mu);padding-bottom:16px}
  .footer strong{color:var(--p);font-weight:800}
  .footer small{display:block;margin-top:4px;font-size:.65rem;color:var(--qu);opacity:.8;letter-spacing:1px}
  [data-theme="dark"] .footer small{color:var(--qug)}

  .toast{position:fixed;bottom:20px;inset-inline:20px;max-width:340px;margin:0 auto;
     padding:12px 18px;background:var(--tx);color:var(--bg);border-radius:10px;
     font-size:.85rem;font-weight:600;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);
     transform:translateY(100px);opacity:0;transition:all .35s ease;z-index:1000}
  .toast.is-visible{transform:translateY(0);opacity:1}

  [hidden]{display:none!important}
  @media (max-width:380px){
    h1{font-size:2rem}
    .result-actions{grid-template-columns:1fr}
    .quantum-metrics{grid-template-columns:1fr}
    .style-img{width:60px;height:60px}
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <button class="theme-btn" id="theme-toggle" aria-label="تغییر تم" type="button">☀️</button>
    <h1>هد لاین <span class="h1-en">HEADLINE</span></h1>
    <span class="h1-sub">⚛ QUANTUM PRO ENGINE v2.0</span>
  </header>

  <section id="step-upload">
    <p class="instruction">📷 عکس <strong>روبه‌رو</strong>، نور خوب، بدون لبخند، مو عقب. <br><small style="color:var(--qu)">⚛ موتور فوق‌کوانتومی با ۴۷۸ نقطه چهره + تحلیل درهم‌تنیدگی</small></p>

    <div id="preview" class="preview" aria-live="polite">
      <img id="preview-img" alt="پیش‌نمایش عکس">
      <canvas id="mesh-canvas"></canvas>
      <span class="preview__badge" id="preview-badge" hidden>⚛ تحلیل شده</span>
      <button id="btn-remove" class="preview__remove" type="button" aria-label="حذف">×</button>
    </div>

    <div class="actions">
      <label for="gallery-input" class="btn btn--primary" role="button" tabindex="0">📸 انتخاب عکس</label>
      <input type="file" id="gallery-input" class="vh" accept="image/jpeg,image/png,image/webp">
      <button id="btn-analyze" class="btn btn--quantum" type="button" disabled>⚛ تحلیل فوق‌کوانتومی چهره</button>
    </div>

    <div id="error-box" class="alert alert--error" role="alert"></div>
  </section>

  <section id="loading" class="loading" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <div class="progress"><div class="progress__fill" id="progress-fill"></div></div>
    <p id="loading-text">در حال بارگذاری موتور کوانتومی...</p>
  </section>

  <section id="step-result" class="result" aria-live="polite">
    <div class="card">
      <div id="result-header"></div>
    </div>

    <div class="card">

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const angle = (a,b,c) => {
  const v1={x:a.x-b.x,y:a.y-b.y}, v2={x:c.x-b.x,y:c.y-b.y};
  const n1=Math.hypot(v1.x,v1.y)+1e-9, n2=Math.hypot(v2.x,v2.y)+1e-9;
  const dot=(v1.x*v2.x+v1.y*v2.y)/(n1*n2);
  return Math.acos(Math.max(-1,Math.min(1,dot)));
};
const clip = (v,min,max) => Math.max(min,Math.min(max,v));

const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

function ensureModel() {
  if (faceLandmarker) return Promise.resolve();
  if (initPromise) return initPromise;
  initPromise = initFaceLandmarker().finally(() => { initPromise = null; });
  return initPromise;
}

async function initFaceLandmarker() {
  els.loadingText.textContent = "⚛ در حال دانلود مدل فوق‌کوانتومی...";
  els.progressFill.style.width = "20%";
  const filesetResolver = await FilesetResolver.forVisionTasks(WASM_URL);
  els.progressFill.style.width = "50%";

  const baseOptions = { modelAssetPath: MODEL_URL, delegate: "GPU" };
  try {
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions, outputFaceBlendshapes: false, runningMode: "IMAGE", numFaces: 1
    });
  } catch (e) {
    console.warn("GPU failed, trying CPU...", e);
    try {
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
        outputFaceBlendshapes: false, runningMode: "IMAGE", numFaces: 1
      });
    } catch (e2) {
      console.error("CPU failed too.", e2);
      throw new Error("خطا در دانلود مدل هوش مصنوعی. لطفا از VPN استفاده کنید یا اتصال اینترنت خود را بررسی کنید.");
    }
  }
  els.progressFill.style.width = "100%";
  els.loadingText.textContent = "آماده است!";
}

function analyzeQuantum(landmarks) {
  const I = {FOREHEAD_TOP:10,CHIN_BOTTOM:152,FOREHEAD_LEFT:54,FOREHEAD_RIGHT:284,
    ZYGOMATIC_LEFT:234,ZYGOMATIC_RIGHT:454,JAW_LEFT:58,JAW_RIGHT:288,
    JAW_MID_L:365,JAW_MID_R:136,GONIAL_LEFT:172,GONIAL_RIGHT:397,
    BROW_LEFT:105,BROW_RIGHT:334,NOSE_TIP:1};
  const d = (i,j) => dist(landmarks[i],landmarks[j]);
  const ang = (i,j,k) => angle(landmarks[i],landmarks[j],landmarks[k]);

  const face_len = d(I.FOREHEAD_TOP,I.CHIN_BOTTOM);
  const forehead_w = d(I.FOREHEAD_LEFT,I.FOREHEAD_RIGHT);
  const cheek_w = d(I.ZYGOMATIC_LEFT,I.ZYGOMATIC_RIGHT);
  const jaw_w = d(I.JAW_LEFT,I.JAW_RIGHT);
  if (cheek_w < 1e-6 || jaw_w < 1e-6 || forehead_w < 1e-6) return null;

  const geo = [face_len/cheek_w, forehead_w/jaw_w, cheek_w/forehead_w, (face_len*0.5)/Math.max(jaw_w*0.5,1e-6)];

  const mid_jaw_y = (landmarks[I.JAW_MID_L].y + landmarks[I.JAW_MID_R].y) * 0.5;
  const gonial_y = (landmarks[I.GONIAL_LEFT].y + landmarks[I.GONIAL_RIGHT].y) * 0.5;
  const chin_y = landmarks[I.CHIN_BOTTOM].y;
  const jaw_round = clip(Math.abs(mid_jaw_y - gonial_y) / (Math.abs(chin_y - gonial_y) + 1e-9), 0, 1);
  const fore_curve = clip(ang(I.BROW_LEFT, I.FOREHEAD_TOP, I.BROW_RIGHT) / Math.PI, 0, 1);
  const cheek_prom = clip((cheek_w - 0.5 * (forehead_w + jaw_w)) / (cheek_w + 1e-9) + 0.5, 0, 1);
  const curv = [jaw_round, fore_curve, cheek_prom];

  const lr_asym = Math.abs(d(I.ZYGOMATIC_LEFT, I.CHIN_BOTTOM) - d(I.ZYGOMATIC_RIGHT, I.CHIN_BOTTOM)) / (cheek_w + 1e-9);
  const ul_bal = Math.abs(face_len * 0.5 - d(I.FOREHEAD_TOP, I.NOSE_TIP)) / (face_len + 1e-9);
  const sym = [clip(lr_asym, 0, 0.2), clip(ul_bal, 0, 0.2)];

  const chin_ang = ang(I.JAW_LEFT, I.CHIN_BOTTOM, I.JAW_RIGHT) / Math.PI;
  const cheek_ang = ang(I.ZYGOMATIC_LEFT, I.NOSE_TIP, I.ZYGOMATIC_RIGHT) / Math.PI;
  const ang_feat = [chin_ang, cheek_ang];

  const obs = { geo, curv, sym, ang: ang_feat };

  const F = {}, R = {};
  for (const name in obs) {
    F[name] = []; R[name] = [];
    for (let s = 0; s < SHAPES.length; s++) {
      const mu = QUANTUM_TARGETS[SHAPES[s]][name];
      const sigma = QUANTUM_SIGMA[name];
      let z2 = 0, rSum = 0;
      for (let i = 0; i < mu.length; i++) {
        const z = (obs[name][i] - mu[i]) / sigma[i];
        z2 += z * z; rSum += z;
      }
      F[name].push(Math.exp(-0.5 * z2));
      R[name].push(rSum / mu.length);
    }
  }

  const psiR = new Array(SHAPES.length).fill(0);
  const psiI = new Array(SHAPES.length).fill(0);
  const featureNames = Object.keys(obs);

  for (let s = 0; s < SHAPES.length; s++) {
    for (const name of featureNames) {
      const w = OBSERVER_WEIGHTS[name];
      const amp = w * Math.sqrt(F[name][s]);
      let phase = OBSERVER_PHASES[name] + Math.atan2(R[name][s], 1.0) + EVOLUTION_TIME * 0.1;

      for (const other of featureNames) {
        if (other === name) continue;
        const key = [name, other].sort().join('|');
        const corr = ENTANGLE[key] || 0;
        phase += corr * Math.sin(R[other][s]) * 0.5;
      }

      psiR[s] += amp * Math.cos(phase);
      psiI[s] += amp * Math.sin(phase);
    }
  }

  const dec = 1 - DECOHERENCE;
  for (let s = 0; s < SHAPES.length; s++) {
    psiR[s] *= dec;
    psiI[s] *= dec;
  }

  let probSum = 0;
  const prob = [];
  for (let s = 0; s < SHAPES.length; s++) {
    const p = psiR[s] ** 2 + psiI[s] ** 2;
    prob.push(p); probSum += p;
  }
  for (let s = 0; s < SHAPES.length; s++) prob[s] /= (probSum + 1e-12);

  let logSum = 0;
  const logPost = [];
  for (let s = 0; s < SHAPES.length; s++) {
    const lp = Math.log(prob[s] + 1e-12) + 0.12 * Math.log(SHAPE_PRIOR[s] + 1e-12);
    logPost.push(lp); logSum += Math.exp(lp);
  }
  const posterior = logPost.map(lp => Math.exp(lp) / logSum);

  let topIdx = 0, maxP = 0;
  for (let s = 0; s < SHAPES.length; s++) if (posterior[s] > maxP) { maxP = posterior[s]; topIdx = s; }

  let entropy = 0;
  for (let s = 0; s < SHAPES.length; s++) entropy -= posterior[s] * Math.log(posterior[s] + 1e-12);
  entropy /= Math.log(SHAPES.length);

  let coherence = 0;
  for (let i = 0; i < SHAPES.length; i++) {
    for (let j = i + 1; j < SHAPES.length; j++) {
      coherence += Math.abs(psiR[i] * psiR[j] + psiI[i] * psiI[j]);
    }
  }
  coherence = clip(coherence / SHAPES.length, 0, 1);

  const gr = Math.abs(face_len / cheek_w - 1.618);
  const goldenScore = Math.exp(-gr * 2.5);

  const symmetryScore = 1 - clip(lr_asym * 2, 0, 1) * 0.7 - clip(ul_bal * 1.5, 0, 1) * 0.3;

  let topFeature = "geo", topContribution = 0;
  const contrib = {};
  for (const name of featureNames) {
    const c = F[name][topIdx] * OBSERVER_WEIGHTS[name];
    contrib[name] = c;
    if (c > topContribution) { topContribution = c; topFeature = name; }
  }
  const featureFA = {geo:"تناسبات هندسی", curv:"انحنای خطوط", sym:"تقارن", ang:"زوایای چهره"};

  return {
    shape: SHAPES[topIdx],
    confidence: posterior[topIdx],
    entropy,
    coherence,
    goldenScore,
    symmetryScore,
    posterior,
    prob,
    topFeature: featureFA[topFeature],
    landmarks: landmarks
  };
}

function drawFaceMesh(canvas, imgEl, landmarks) {
  const w = canvas.clientWidth || imgEl.clientWidth;
  const h = canvas.clientHeight || imgEl.clientHeight;
  if (w === 0 || h === 0) return;

  canvas.width = w * window.devicePixelRatio;
  canvas.height = h * window.devicePixelRatio;
  const ctx = canvas.getContext("2d");
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const connections = [
    [10,338],[338,297],[297,332],[332,284],[284,251],[251,301],[301,293],[293,298],
    [298,296],[296,336],[336,285],[285,295],[295,282],[282,283],[283,276],[276,250],
    [250,290],[290,305],[305,307],[307,306],[306,408],[408,304],[304,303],[303,302],
    [302,310],[310,311],[311,312],[312,13],[13,82],[82,81],[81,80],[80,191],
    [191,78],[78,62],[62,76],[76,77],[77,72],[72,11],[11,37],[37,0],
    [0,267],[267,269],[269,270],[270,409],[409,291],[291,375],[375,321],[321,405],
    [405,314],[314,17],[17,84],[84,181],[181,91],[91,146],[146,61],[61,185],
    [185,40],[40,39],[39,156],[156,70],[70,63],[63,105],[105,66],[66,107],
    [33,7],[7,163],[163,144],[144,145],[145,153],[153,154],[154,155],[155,133],
    [133,33],[246,161],[161,160],[160,159],[159,158],[158,157],[157,173],[173,133],
    [133,155],[362,263],[263,249],[249,390],[390,373],[373,374],[374,380],[380,381],
    [381,382],[382,362],[466,388],[388,387],[387,386],[386,385],[385,384],[384,398],[398,362],
    [168,6],[6,197],[197,195],[195,5],[5,4],[4,1],[1,2],[2,164],[164,167],
    [167,165],[165,3],[3,51],[51,45],[45,220],[220,115],[115,131],
    [131,134],[134,236],[236,198],[198,217],[217,126],[126,142],
    [142,36],[36,100],[100,47],[47,114],[114,128],[128,216],
  ];
  ctx.strokeStyle = "rgba(124, 95, 211, 0.55)";
  ctx.lineWidth = 1;
  for (const [a, b] of connections) {
    const pa = landmarks[a], pb = landmarks[b];
    if (!pa || !pb) continue;
    ctx.beginPath();
    ctx.moveTo(pa.x * w, pa.y * h);
    ctx.lineTo(pb.x * w, pb.y * h);
    ctx.stroke();
  }

  const keyPoints = [10,152,54,284,234,454,58,288,172,397,105,334,1,33,263,61,291,13,14];
  ctx.fillStyle = "rgba(124, 95, 211, 0.9)";
  for (const idx of keyPoints) {
    const p = landmarks[idx];
    if (!p) continue;
    ctx.beginPath();
    ctx.arc(p.x * w, p.y * h, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

async function setFile(f) {
  if (!f) return;
  els.errorBox.classList.remove("is-visible", "alert--warn");
  els.loading.style.display = "none";
  els.previewBadge.hidden = true;
  els.analyzeBtn.disabled = true;
  els.analyzeBtn.textContent = "⏳ در حال آماده‌سازی...";

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = async () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(f);
      lastImageEl = img;
      els.previewImg.src = objectUrl;
      els.preview.classList.add("is-visible");
      els.meshCanvas.width = 0;
      els.meshCanvas.height = 0;
      els.analyzeBtn.disabled = false;
      els.analyzeBtn.textContent = "⚛ تحلیل فوق‌کوانتومی چهره";
      setTimeout(() => runAnalysis(img), 250);
    };
    img.src = e.target.result;
  };
  reader.onerror = () => toast("خطا در خواندن فایل");
  reader.readAsDataURL(f);
}

async function runAnalysis(imgElement) {
  if (!imgElement) return;
  els.upload.style.display = "none";
  els.loading.style.display = "block";
  els.progressFill.style.width = "10%";

  try {
    if (!faceLandmarker) await ensureModel();
    els.loadingText.textContent = "⚛ در حال استخراج ۴۷۸ نقطه چهره...";
    els.progressFill.style.width = "55%";
    await new Promise(r => setTimeout(r, 120));

    const canvas = document.createElement("canvas");
    let w = imgElement.naturalWidth || imgElement.width;
    let h = imgElement.naturalHeight || imgElement.height;
    const maxSide = 800;
    if (w > maxSide) { h *= maxSide / w; w = maxSide; }
    if (h > maxSide) { w *= maxSide / h; h = maxSide; }
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(imgElement, 0, 0, w, h);

    const bitmap = await createImageBitmap(canvas);
    const results = faceLandmarker.detect(bitmap);

    if (!results.faceLandmarks || results.faceLandmarks.length === 0) {
      throw new Error("چهره‌ای در عکس پیدا نشد. لطفاً عکس واضح‌تری انتخاب کنید.");
    }
    els.progressFill.style.width = "75%";
    els.loadingText.textContent = "⚛ درهم‌تنیدگی و محاسبه تابع موج...";
    await new Promise(r => setTimeout(r, 250));

    const landmarks = results.faceLandmarks[0];
    const analysis = analyzeQuantum(landmarks);
    if (!analysis) throw new Error("محاسبه ویژگی‌های صورت ناموفق بود.");

    const tilt = Math.abs(Math.atan2(landmarks[152].x - landmarks[10].x, landmarks[152].y - landmarks[10].y));
    if (tilt > 0.35) {
      els.errorBox.textContent = "⚠️ هشدار: سر شما کج است — نتایج ممکن است دقت کمتری داشته باشند.";
      els.errorBox.classList.add("alert--warn","is-visible");
    }

    const suitableStyles = HAIRSTYLES.filter(s => s.shapes.includes(analysis.shape));
    lastResult = { analysis, styles: suitableStyles };

    els.progressFill.style.width = "100%";
    els.loadingText.textContent = "⚛ تحلیل کامل شد — فروریزش تابع موج ✓";
    await new Promise(r => setTimeout(r, 300));

    drawFaceMesh(els.meshCanvas, imgElement, landmarks);
    els.previewBadge.hidden = false;

    renderResults();
    if (navigator.vibrate) navigator.vibrate([20, 50, 20]);

  } catch (err) {
    console.error(err);
    els.upload.style.display = "block";
    els.loading.style.display = "none";
    els.analyzeBtn.disabled = false;
    els.analyzeBtn.textContent = "⚛ تحلیل فوق‌کوانتومی چهره";
    els.errorBox.textContent = "⚠️ خطا: " + (err.message || err);
    els.errorBox.classList.add("alert--error","is-visible");
    toast("تحلیل ناموفق بود — دوباره تلاش کنید");
  }
}

function renderResults() {
  const { analysis, styles } = lastResult;
  const shapeFa = SHAPE_FA[analysis.shape];
  const shapeEn = SHAPE_EN[analysis.shape];
  const pct = Math.round(analysis.confidence * 100);

  els.resultHeader.innerHTML = `
    <div class="result__shape">
      <span class="result__shape-label">⚛ فرم صورت شما (پس از فروریزش تابع موج)</span>
      <span class="result__shape-value">${shapeFa}</span>
      <span class="result__shape-en">${shapeEn}</span>
    </div>
    <div class="conf">
      <span class="conf__bar">
        <span class="conf__fill" id="conf-fill" style="width:0%"></span>
      </span>
      <span class="conf__pct">${pct}% اطمینان</span>
    </div>
    <div class="prob-chart">
      <div class="prob-chart__title">توزیع احتمال کوانتومی فرم‌ها</div>
      ${SHAPES.map((s, i) => `
        <div class="prob-row ${i === SHAPES.indexOf(analysis.shape) ? 'prob-row--top' : ''}">
          <span class="prob-label">${SHAPE_FA[s]}</span>
          <div class="prob-bar"><div class="prob-fill" data-pct="${(analysis.posterior[i] * 100).toFixed(1)}"></div></div>
          <span class="prob-pct">${(analysis.posterior[i] * 100).toFixed(1)}%</span>
        </div>
      `).join("")}
    </div>
  `;

  const entropyPct = Math.round(analysis.entropy * 100);
  const cohPct = Math.round(analysis.coherence * 100);
  const goldPct = Math.round(analysis.goldenScore * 100);
  const symPct = Math.round(analysis.symmetryScore * 100);
  const entropyLabel = analysis.entropy < 0.4 ? "قطعی" : analysis.entropy < 0.7 ? "متوسط" : "نامطمئن";

  els.quantumPanel.innerHTML = `
    <div class="quantum-box">
      <div class="quantum-box__title">پارامترهای حالت کوانتومی</div>
      <div class="quantum-metrics">
        <div class="qm"><span class="qm__label">آنتروپی (عدم‌قطعیت)</span><span class="qm__val qm__val--qu">${entropyPct}% · ${entropyLabel}</span></div>
        <div class="qm"><span class="qm__label">همدوسی کوانتومی</span><span class="qm__val qm__val--qu">${cohPct}%</span></div>
        <div class="qm"><span class="qm__label">نسبت طلایی</span><span class="qm__val ${goldPct > 70 ? 'qm__val--ok' : 'qm__val--warn'}">${goldPct}%</span></div>
        <div class="qm"><span class="qm__label">تقارن چهره</span><span class="qm__val ${symPct > 70 ? 'qm__val--ok' : 'qm__val--warn'}">${symPct}%</span></div>
        <div class="qm" style="grid-column:1/-1"><span class="qm__label">ویژگی تعیین‌کننده</span><span class="qm__val qm__val--qu">${analysis.topFeature}</span></div>
      </div>
    </div>
  `;

  renderStyles(styles);
  els.loading.style.display = "none";
  els.result.classList.add("is-visible");

  requestAnimationFrame(() => {
    const cf = $("conf-fill");
    if (cf) cf.style.width = pct + "%";
    document.querySelectorAll(".prob-fill[data-pct]").forEach((el, i) => {
      setTimeout(() => { el.style.width = el.dataset.pct + "%"; }, 100 + i * 60);
    });
  });
}

function renderStyles(styles) {
  const filtered = styles.filter(s => {
    if (prefs.length !== "all" && s.len !== prefs.length) return false;
    if (prefs.vibe !== "all" && s.vibe !== prefs.vibe) return false;
    return true;
  });

  els.styleCount.textContent = `${filtered.length} مدل کوانتومی پیشنهادی`;
  if (filtered.length === 0) {
    els.stylesList.innerHTML = `<div class="empty">با این فیلترها مدل کوانتومی‌ای پیدا نشد. فیلترها را تغییر دهید.</div>`;
    return;
  }

  let favorites = [];
  try { favorites = JSON.parse(localStorage.getItem("headline_favs") || "[]"); } catch(e) { favorites = []; }

  els.stylesList.innerHTML = filtered.map((s, i) => {
    const searchQuery = "men's " + s.en + " haircut";
    const imgLink = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(searchQuery)}`;
    return `
    <div class="style-card" style="animation-delay:${i * 40}ms">
      <img src="${s.img || FALLBACK_IMG}" alt="${s.fa}" class="style-img" onerror="this.src='${FALLBACK_IMG}'">
      <div class="style-body">
        <strong class="style-title">${s.fa}<span class="style-title-en">${s.en}</span></strong>
        <p class="style-why">⚛ ${s.why}</p>
        <div class="style-tags">
          <span class="tag">${LEN_FA[s.len]}</span>
          <span class="tag">${VIBE_FA[s.vibe]}</span>
          <a href="${imgLink}" target="_blank" rel="noopener" class="tag tag--img">🔍 دیدن عکس</a>
          <button class="tag tag--fav ${favorites.includes(s.id) ? 'is-active' : ''}"
                  data-fav="${s.id}" type="button" aria-label="ذخیره">${favorites.includes(s.id) ? '★' : '☆'} ذخیره</button>
        </div>
      </div>
    </div>
  `}).join("");

  els.stylesList.querySelectorAll("[data-fav]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.fav;
      let favs = [];
      try { favs = JSON.parse(localStorage.getItem("headline_favs") || "[]"); } catch(e) {}
      const idx = favs.indexOf(id);
      if (idx >= 0) { favs.splice(idx, 1); btn.classList.remove("is-active"); btn.innerHTML = "☆ ذخیره"; }
      else { favs.push(id); btn.classList.add("is-active"); btn.innerHTML = "★ ذخیره شد"; toast("به علاقه‌مندی‌ها اضافه شد"); }
      try { localStorage.setItem("headline_favs", JSON.stringify(favs)); } catch(e) {}
    });
  });
}

els.galleryInput.addEventListener("change", e => setFile(e.target.files?.[0]));

els.removeBtn.addEventListener("click", () => {
  els.preview.classList.remove("is-visible");
  els.previewImg.src = "";
  els.meshCanvas.width = 0;
  els.meshCanvas.height = 0;
  els.previewBadge.hidden = true;
  els.analyzeBtn.disabled = true;
  els.analyzeBtn.textContent = "⚛ تحلیل فوق‌کوانتومی چهره";
  if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  lastImageEl = null;
});

els.analyzeBtn.addEventListener("click", () => {
  if (lastImageEl) runAnalysis(lastImageEl);
  else if (els.previewImg.src && els.previewImg.complete) runAnalysis(els.previewImg);
});

els.restartBtn.addEventListener("click", () => {
  els.result.classList.remove("is-visible");
  els.upload.style.display = "block";
  els.preview.classList.remove("is-visible");
  els.previewImg.src = "";
  els.meshCanvas.width = 0;
  els.meshCanvas.height = 0;
  els.previewBadge.hidden = true;
  els.loading.style.display = "none";
  els.errorBox.classList.remove("is-visible","alert--warn","alert--error");
  els.analyzeBtn.textContent = "⚛ تحلیل فوق‌کوانتومی چهره";
  els.analyzeBtn.disabled = true;
  els.progressFill.style.width = "0%";
  lastResult = null;
  lastImageEl = null;
  if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  els.galleryInput.value = "";
});

els.shareBtn.addEventListener("click", async () => {
  if (!lastResult) return;
  const { analysis, styles } = lastResult;
  const text = `⚛ نتیجه تحلیل کوانتومی هد لاین:\nفرم صورت: ${SHAPE_FA[analysis.shape]} (${SHAPE_EN[analysis.shape]})\nاطمینان: ${Math.round(analysis.confidence * 100)}%\nنسبت طلایی: ${Math.round(analysis.goldenScore * 100)}%\n\nمدل‌های پیشنهادی:\n${styles.slice(0, 5).map((s, i) => `${i + 1}. ${s.fa} (${s.en})`).join("\n")}\n\n— Headline Pro Quantum`;
  if (navigator.share) {
    try { await navigator.share({ title: "هد لاین — تحلیل کوانتومی", text }); return; } catch {}
  }
  try {
    await navigator.clipboard.writeText(text);
    toast("نتیجه در کلیپ‌بورد کپی شد ✓");
  } catch {
    toast("اشتراک‌گذاری پشتیبانی نمی‌شود");
  }
});

els.prefs.querySelectorAll(".chips").forEach(chipsEl => {
  const key = chipsEl.dataset.pref;
  chipsEl.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    chipsEl.querySelectorAll(".chip").forEach(c => c.classList.remove("chip--active"));
    btn.classList.add("chip--active");
    prefs[key] = btn.dataset.val;
    if (lastResult) renderStyles(lastResult.styles);
  });
});

ensureModel().catch(err => console.warn("Model preload failed:", err));
</script>
