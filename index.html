<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b6f4e">
<title>هد لاین Pro — مشاور کوانتومی مدل مو</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap');

  :root{
    --p:#8b6f4e;--pd:#6d5640;--pl:#a98a68;--bg:#f7f5f2;--sf:#fff;
    --tx:#2c2c2c;--mu:#888;--bd:#e5e0d8;--er:#c0392b;--erb:#fdecea;
    --qu:#5b3fa8;--qub:#e8e3f7;--qug:#7c5fd3;
    --ok:#16a34a;--okb:#dcfce7;--warn:#d97706;--warnb:#fef3c7;
    --r:14px;--r2:8px;--sh:0 4px 20px rgba(139,111,78,.10);
    --sh2:0 8px 32px rgba(91,63,168,.15);
    --grad:linear-gradient(135deg,#8b6f4e 0%,#a98a68 100%);
    --gradq:linear-gradient(135deg,#5b3fa8 0%,#7c5fd3 100%);
  }
  [data-theme="dark"]{
    --bg:#121212;--sf:#1e1e1e;--tx:#f0f0f0;--mu:#a0a0a0;--bd:#333;
    --erb:#3a1815;--qub:#2a2140;--okb:#14331f;--warnb:#3d2a0a;
    --sh:0 4px 20px rgba(0,0,0,.5);--sh2:0 8px 32px rgba(0,0,0,.6);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;min-height:100dvh;background-color:var(--bg);color:var(--tx);
    font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.65;padding:16px 16px 32px;
    background-image:linear-gradient(rgba(247,245,242,.94),rgba(247,245,242,.97)),
      url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=2074&auto=format&fit=crop');
    background-size:cover;background-position:center;background-attachment:fixed;
    transition:background-color .3s,color .3s;
  }
  [data-theme="dark"] body{
    background-image:linear-gradient(rgba(18,18,18,.95),rgba(18,18,18,.97)),
      url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=2074&auto=format&fit=crop');
  }
  .container{max-width:560px;margin:0 auto;position:relative}

  /* Header */
  .header{text-align:center;margin-bottom:16px;position:relative;padding-top:8px}
  h1{margin:0;font-size:2.1rem;font-weight:800;color:var(--p);
     background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
     background-clip:text;letter-spacing:-.5px}
  .h1-en{display:block;font-size:.85rem;font-weight:500;color:var(--mu);
     letter-spacing:3px;margin-top:2px;-webkit-text-fill-color:var(--mu)}
  .badge{display:inline-block;background:var(--gradq);color:#fff;font-size:.68rem;
     padding:4px 12px;border-radius:999px;font-weight:600;margin-top:8px;
     box-shadow:0 2px 8px rgba(91,63,168,.3)}

  /* Theme toggle */
  .theme-btn{position:absolute;top:0;inset-inline-end:0;width:40px;height:40px;
     border-radius:50%;background:var(--sf);border:1px solid var(--bd);cursor:pointer;
     font-size:1.1rem;display:grid;place-items:center;box-shadow:var(--sh);
     transition:transform .2s}
  .theme-btn:active{transform:scale(.92)}

  /* Steps bar */
  .steps{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 20px}
  .step-dot{width:28px;height:28px;border-radius:50%;background:var(--sf);
     border:2px solid var(--bd);display:grid;place-items:center;font-size:.8rem;
     font-weight:700;color:var(--mu);transition:all .3s}
  .step-dot.active{background:var(--p);border-color:var(--p);color:#fff;transform:scale(1.1)}
  .step-dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .step-line{width:32px;height:2px;background:var(--bd);border-radius:1px;transition:background .3s}
  .step-line.done{background:var(--ok)}

  /* Instruction */
  .instruction{padding:12px 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
     border-right:4px solid var(--pl);border-radius:var(--r2);font-size:.88rem;margin-bottom:14px;
     box-shadow:var(--sh)}
  [data-theme="dark"] .instruction{background:rgba(30,30,30,.85)}

  /* Buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
     border:none;border-radius:var(--r);font-family:inherit;font-size:1rem;font-weight:600;
     cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;
     position:relative;overflow:hidden}
  .btn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,
     rgba(255,255,255,.4) 0%,transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
  .btn:active:not(:disabled)::after{opacity:1;transition:opacity 0s}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn:disabled{background:var(--bd);color:var(--mu);cursor:not-allowed}
  .btn--primary{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(139,111,78,.3)}
  .btn--primary:hover:not(:disabled){box-shadow:0 6px 20px rgba(139,111,78,.4);transform:translateY(-1px)}
  .btn--secondary{background:var(--sf);color:var(--p);border:1.5px solid var(--p)}
  .btn--secondary:hover:not(:disabled){background:var(--pl);color:#fff;border-color:var(--pl)}
  .btn--ghost{background:transparent;color:var(--mu)}
  .btn--small{padding:9px 14px;font-size:.85rem;width:auto}
  .actions{display:flex;flex-direction:column;gap:10px}
  .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

  /* Camera */
  .camera-view{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:14px;
     box-shadow:var(--sh);background:#000;display:none}
  .camera-view.is-visible{display:block;animation:slideIn .3s ease-out}
  .camera-view video{display:block;width:100%;max-height:380px;object-fit:cover;background:#000}
  .camera-view__bar{position:absolute;bottom:12px;inset-inline:12px;display:flex;gap:8px}
  .camera-view__bar .btn{flex:1;backdrop-filter:blur(10px);background:rgba(255,255,255,.92);color:var(--tx)}
  .camera-view__bar .btn--primary{background:var(--grad);color:#fff}

  /* Preview */
  .preview{display:none;position:relative;border-radius:var(--r);overflow:hidden;
     margin-bottom:14px;box-shadow:var(--sh)}
  .preview.is-visible{display:block;animation:slideIn .3s ease-out}
  .preview img{display:block;width:100%;max-height:340px;object-fit:cover}
  .preview__remove{position:absolute;top:8px;inset-inline-start:8px;width:36px;height:36px;
     padding:0;border:none;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;
     font-size:18px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px)}

  /* Loading */
  .loading{display:none;text-align:center;padding:28px 20px;
     background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:var(--r);
     box-shadow:var(--sh)}
  [data-theme="dark"] .loading{background:rgba(30,30,30,.9)}
  .loading.is-visible{display:block;animation:fadeIn .3s}
  .spinner{width:44px;height:44px;margin:0 auto 16px;border:3px solid var(--bd);
     border-top-color:var(--qu);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .progress{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:0 0 14px}
  .progress__fill{height:100%;background:var(--gradq);width:0%;border-radius:3px;
     transition:width .4s ease}
  #loading-text{margin:0;color:var(--qu);font-weight:600;font-size:.9rem}

  /* Alerts */
  .alert{display:none;padding:12px 16px;border-radius:var(--r2);font-size:.88rem;margin-top:12px}
  .alert.is-visible{display:block;animation:slideIn .3s}
  .alert--error{background:var(--erb);color:var(--er);border-right:4px solid var(--er)}
  .alert--ok{background:var(--okb);color:var(--ok);border-right:4px solid var(--ok)}

  /* Results */
  .result{display:none;margin-top:14px}
  .result.is-visible{display:block;animation:slideIn .4s}
  .card{background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
     border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:14px}
  [data-theme="dark"] .card{background:rgba(30,30,30,.95)}

  .result__shape{text-align:center;padding-bottom:14px;margin-bottom:14px;
     border-bottom:1px solid var(--bd)}
  .result__shape-label{display:block;font-size:.82rem;color:var(--mu)}
  .result__shape-value{display:block;font-size:2rem;font-weight:800;color:var(--p);
     margin-top:4px;letter-spacing:-1px}
  .result__shape-en{display:block;font-size:.8rem;color:var(--mu);margin-top:2px;
     letter-spacing:1px;text-transform:uppercase}

  /* Confidence */
  .conf{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0 14px}
  .conf__bar{flex:0 0 160px;height:8px;background:var(--bd);border-radius:4px;
     overflow:hidden;position:relative}
  .conf__ci{position:absolute;top:0;height:100%;background:rgba(91,63,168,.2)}
  .conf__fill{position:absolute;top:0;height:100%;background:var(--grad);border-radius:4px;
     transition:width 1s ease}
  .conf__pct{font-size:.85rem;color:var(--mu);font-weight:600;font-variant-numeric:tabular-nums}

  /* Quantum box */
  .quantum-box{background:linear-gradient(135deg,rgba(244,240,255,.9) 0%,rgba(255,255,255,.9) 100%);
     border:1px solid var(--qub);border-radius:10px;padding:12px 14px;margin:12px 0}
  [data-theme="dark"] .quantum-box{background:linear-gradient(135deg,rgba(42,33,64,.9) 0%,rgba(30,30,30,.9) 100%)}
  .quantum-box__title{font-size:.75rem;color:var(--qu);font-weight:700;margin-bottom:8px;
     letter-spacing:.02em;display:flex;align-items:center;gap:4px}
  .quantum-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .qm{display:flex;flex-direction:column;gap:2px}
  .qm__label{font-size:.7rem;color:var(--mu)}
  .qm__val{font-size:.95rem;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
  .qm__val--qu{color:var(--qu)}

  /* Probabilities */
  .probs{margin:14px 0}
  .probs__title{font-size:.8rem;font-weight:700;color:var(--tx);margin-bottom:10px;
     display:flex;justify-content:space-between;align-items:center}
  .probs__title small{font-weight:400;color:var(--mu);font-size:.7rem}
  .prob-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:.82rem}
  .prob-row__name{flex:0 0 62px;color:var(--tx);font-weight:500}
  .prob-row__bar{flex:1;height:7px;background:var(--bd);border-radius:4px;overflow:hidden}
  .prob-row__fill{height:100%;background:var(--qu);border-radius:4px;
     transition:width 1s ease;animation:growBar 1s ease}
  .prob-row--top .prob-row__fill{background:var(--grad)}
  .prob-row--top .prob-row__name{font-weight:800;color:var(--p)}
  @keyframes growBar{from{width:0!important}}
  .prob-row__pct{flex:0 0 42px;text-align:left;font-variant-numeric:tabular-nums;
     color:var(--mu);font-size:.75rem}

  /* Info cards */
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .info-card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
  [data-theme="dark"] .info-card{background:#252525}
  .info-card__label{font-size:.7rem;color:var(--mu);display:flex;align-items:center;gap:4px}
  .info-card__value{font-size:.92rem;font-weight:700;color:var(--tx);margin-top:3px}
  .info-card__hint{font-size:.72rem;color:var(--mu);margin-top:2px}

  /* Prefs */
  .prefs{margin:16px 0}
  .prefs__row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .prefs__label{font-size:.82rem;color:var(--mu);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 12px;border:1.5px solid var(--bd);background:var(--sf);
     border-radius:999px;font-family:inherit;font-size:.78rem;color:var(--tx);
     cursor:pointer;transition:all .15s;font-weight:500}
  .chip:hover{border-color:var(--pl);transform:translateY(-1px)}
  .chip--active{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}

  /* Style cards */
  .result__title{margin:16px 0 12px;font-weight:700;display:flex;justify-content:space-between;
     align-items:center;font-size:.95rem}
  .result__count{font-size:.8rem;color:var(--mu);font-weight:400}
  .style-card{display:flex;gap:12px;padding:14px;background:var(--bg);border-radius:10px;
     margin-bottom:10px;border:1px solid transparent;transition:all .2s}
  .style-card:hover{border-color:var(--pl);box-shadow:var(--sh);transform:translateY(-1px)}
  .style-num{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;
     font-size:.85rem;font-weight:700;display:grid;place-items:center;flex-shrink:0}
  .style-body{flex:1;min-width:0}
  .style-title{font-size:.95rem;font-weight:700}
  .style-title-en{font-size:.75rem;color:var(--mu);font-weight:400;margin-inline-start:4px}
  .style-desc{font-size:.82rem;color:var(--mu);margin:4px 0 0}
  .style-why{font-size:.78rem;color:var(--p);margin:4px 0 0;font-weight:500}
  .style-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .tag{font-size:.7rem;padding:2px 8px;background:var(--sf);border:1px solid var(--bd);
     border-radius:999px;color:var(--mu);font-weight:500}
  .tag--diff{color:#b45309;border-color:#fde68a;background:#fffbeb}
  .tag--maint{color:var(--ok);border-color:#bbf7d0;background:var(--okb)}
  .tag--img{background:#e8f0fe;color:#1a73e8;border-color:#a8c7fa;
     text-decoration:none;display:inline-block;cursor:pointer;font-weight:600}
  .tag--img:hover{background:#d2e3fc}

  /* Result actions */
  .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .result-actions .btn{font-size:.85rem;padding:11px}

  .empty{padding:28px;text-align:center;color:var(--mu);font-size:.9rem}
  .empty__icon{font-size:2rem;margin-bottom:6px;opacity:.5}

  /* Footer */
  .footer{text-align:center;margin-top:32px;font-size:.75rem;color:var(--mu);padding-bottom:16px}
  .footer strong{color:var(--p);font-weight:700}

  /* Toast */
  .toast{position:fixed;bottom:20px;inset-inline:20px;max-width:320px;margin:0 auto;
     padding:12px 18px;background:var(--tx);color:var(--bg);border-radius:10px;
     font-size:.85rem;font-weight:500;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);
     transform:translateY(100px);opacity:0;transition:all .35s ease;z-index:1000}
  .toast.is-visible{transform:translateY(0);opacity:1}

  /* History drawer */
  .history{display:none;margin-top:16px;padding:14px;background:var(--sf);
     border:1px solid var(--bd);border-radius:var(--r)}
  .history.is-visible{display:block;animation:slideIn .3s}
  .history__title{font-size:.85rem;font-weight:700;margin-bottom:10px;display:flex;
     justify-content:space-between;align-items:center}
  .history__clear{font-size:.75rem;color:var(--er);cursor:pointer;background:none;
     border:none;font-family:inherit}
  .history-item{display:flex;justify-content:space-between;align-items:center;
     padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:.82rem}
  .history-item__shape{font-weight:700;color:var(--p)}
  .history-item__date{color:var(--mu);font-size:.72rem}

  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  @media (max-width:380px){
    h1{font-size:1.7rem}
    .result-actions{grid-template-columns:1fr}
    .info-grid{grid-template-columns:1fr}
    .prob-row__name{flex-basis:54px;font-size:.75rem}
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <button class="theme-btn" id="theme-toggle" aria-label="تغییر تم" type="button">🌙</button>
    <h1>هد لاین <span class="h1-en">HEADLINE · PRO</span></h1>
    <span class="badge">⚛️ v6.0 · موتور کوانتومی نسل جدید</span>
  </header>

  <div class="steps" id="steps-bar">
    <span class="step-dot active" data-step="1">۱</span>
    <span class="step-line" data-line="1"></span>
    <span class="step-dot" data-step="2">۲</span>
    <span class="step-line" data-line="2"></span>
    <span class="step-dot" data-step="3">۳</span>
  </div>

  <section id="step-upload">
    <p class="instruction">📷 عکس <strong>روبه‌رو</strong>، نور خوب، بدون لبخند، مو عقب. دقت تحلیل با کیفیت عکس مستقیمه.</p>

    <div id="camera-view" class="camera-view">
      <video id="video" autoplay playsinline muted></video>
      <div class="camera-view__bar">
        <button class="btn btn--secondary" id="btn-cam-cancel" type="button">لغو</button>
        <button class="btn btn--primary" id="btn-cam-capture" type="button">📸 گرفتن</button>
      </div>
    </div>

    <div id="preview" class="preview" aria-live="polite">
      <img id="preview-img" alt="پیش‌نمایش عکس">
      <button id="btn-remove" class="preview__remove" type="button" aria-label="حذف">×</button>
    </div>

    <div class="actions">
      <button id="btn-camera" class="btn btn--primary" type="button">📸 دوربین زنده</button>
      <label for="gallery-input" class="btn btn--secondary" role="button" tabindex="0">🖼️ انتخاب از گالری</label>
      <input type="file" id="gallery-input" class="vh" accept="image/jpeg,image/png,image/webp">
      <button id="btn-analyze" class="btn btn--primary" type="button" disabled>✨ تحلیل کوانتومی چهره</button>
    </div>

    <div id="error-box" class="alert alert--error" role="alert"></div>
  </section>

  <section id="loading" class="loading" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <div class="progress"><div class="progress__fill" id="progress-fill"></div></div>
    <p id="loading-text">در حال بارگذاری موتور کوانتومی...</p>
  </section>

  <section id="step-result" class="result" aria-live="polite">
    <div class="card">
      <div id="result-header"></div>
      <div id="probs-container"></div>
      <div id="info-container"></div>
    </div>

    <div class="card">
      <div class="prefs" aria-label="سلیقه">
        <div class="prefs__row"><span class="prefs__label">طول</span>
          <div class="chips" data-pref="length">
            <button class="chip chip--active" data-val="all" type="button">همه</button>
            <button class="chip" data-val="short" type="button">کوتاه</button>
            <button class="chip" data-val="medium" type="button">متوسط</button>
            <button class="chip" data-val="long" type="button">بلند</button>
          </div>
        </div>
        <div class="prefs__row"><span class="prefs__label">بافت</span>
          <div class="chips" data-pref="texture">
            <button class="chip chip--active" data-val="all" type="button">همه</button>
            <button class="chip" data-val="straight" type="button">صاف</button>
            <button class="chip" data-val="wavy" type="button">موج</button>
            <button class="chip" data-val="curly" type="button">فر</button>
          </div>
        </div>
        <div class="prefs__row"><span class="prefs__label">سبک</span>
          <div class="chips" data-pref="vibe">
            <button class="chip chip--active" data-val="all" type="button">همه</button>
            <button class="chip" data-val="classic" type="button">کلاسیک</button>
            <button class="chip" data-val="modern" type="button">مدرن</button>
            <button class="chip" data-val="edgy" type="button">جسورانه</button>
            <button class="chip" data-val="elegant" type="button">شیک</button>
          </div>
        </div>
        <div class="prefs__row"><span class="prefs__label">نگهداری</span>
          <div class="chips" data-pref="maintenance">
            <button class="chip chip--active" data-val="all" type="button">همه</button>
            <button class="chip" data-val="low" type="button">کم</button>
            <button class="chip" data-val="medium" type="button">متوسط</button>
            <button class="chip" data-val="high" type="button">زیاد</button>
          </div>
        </div>
      </div>

      <div class="result__title">
        <span>مدل‌های پیشنهادی</span>
        <span class="result__count" id="style-count"></span>
      </div>
      <div id="styles-list"></div>
    </div>

    <div class="result-actions">
      <button class="btn btn--secondary" id="btn-share" type="button">🔗 اشتراک‌گذاری</button>
      <button class="btn btn--secondary" id="btn-save" type="button">💾 ذخیره نتیجه</button>
    </div>
    <button id="btn-restart" class="btn btn--ghost" type="button" style="margin-top:10px">↺ شروع دوباره</button>

    <div class="history" id="history">

const QUANTUM_TARGETS = {
  oval:{geo:[1.45,1.12,1.15,1.05],curv:[0.55,0.60,0.50],sym:[0.02,0.05],ang:[0.55,0.60]},
  round:{geo:[1.10,1.00,1.05,1.25],curv:[0.85,0.70,0.65],sym:[0.03,0.03],ang:[0.70,0.75]},

  heart:{geo:[1.45,1.35,0.90,1.10],curv:[0.65,0.80,0.75],sym:[0.04,0.08],ang:[0.50,0.45]},
  oblong:{geo:[1.75,1.00,1.05,1.20],curv:[0.45,0.40,0.50],sym:[0.02,0.06],ang:[0.65,0.55]},

  triangle:{geo:[1.30,0.78,1.10,1.35],curv:[0.50,0.30,0.75],sym:[0.03,0.10],ang:[0.75,0.80]}
};
const QUANTUM_SIGMA = {geo:[0.18,0.14,0.14,0.20],curv:[0.20,0.22,0.22],sym:[0.04,0.06],ang:[0.15,0.15]};
const OBSERVER_WEIGHTS = {geo:0.42,curv:0.24,sym:0.14,ang:0.20};
const OBSERVER_PHASES = {geo:0.0,curv:Math.PI/3,sym:2*Math.PI/3,ang:Math.PI};
const SHAPES = ["oval","round","square","heart","oblong","diamond","triangle"];
const SHAPE_PRIOR = [0.22,0.18,0.16,0.12,0.10,0.12,0.10];

/* ===== Math ===== */
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const angle = (a,b,c) => {
  const v1={x:a.x-b.x,y:a.y-b.y}, v2={x:c.x-b.x,y:c.y-b.y};
  const n1=Math.hypot(v1.x,v1.y)+1e-9, n2=Math.hypot(v2.x,v2.y)+1e-9;
  const dot=(v1.x*v2.x+v1.y*v2.y)/(n1*n2);
  return Math.acos(Math.max(-1,Math.min(1,dot)));
};
const clip = (v,min,max) => Math.max(min,Math.min(max,v));

/* ===== Quantum Analysis ===== */
function analyzeQuantum(landmarks) {
  const I = {FOREHEAD_TOP:10,CHIN_BOTTOM:152,FOREHEAD_LEFT:54,FOREHEAD_RIGHT:284,
    ZYGOMATIC_LEFT:234,ZYGOMATIC_RIGHT:454,JAW_LEFT:58,JAW_RIGHT:288,
    JAW_MID_L:365,JAW_MID_R:136,GONIAL_LEFT:172,GONIAL_RIGHT:397,
    BROW_LEFT:105,BROW_RIGHT:334,NOSE_TIP:1};
  const d = (i,j) => dist(landmarks[i],landmarks[j]);
  const ang = (i,j,k) => angle(landmarks[i],landmarks[j],landmarks[k]);

  const face_len = d(I.FOREHEAD_TOP,I.CHIN_BOTTOM);
  const forehead_w = d(I.FOREHEAD_LEFT,I.FOREHEAD_RIGHT);
  const cheek_w = d(I.ZYGOMATIC_LEFT,I.ZYGOMATIC_RIGHT);
  const jaw_w = d(I.JAW_LEFT,I.JAW_RIGHT);
  if (cheek_w < 1e-6 || jaw_w < 1e-6 || forehead_w < 1e-6) return null;

  const geo = [face_len/cheek_w, forehead_w/jaw_w, cheek_w/forehead_w,
               (face_len*0.5)/Math.max(jaw_w*0.5,1e-6)];
  const mid_jaw_y = (landmarks[I.JAW_MID_L].y+landmarks[I.JAW_MID_R].y)*0.5;
  const gonial_y = (landmarks[I.GONIAL_LEFT].y+landmarks[I.GONIAL_RIGHT].y)*0.5;
  const chin_y = landmarks[I.CHIN_BOTTOM].y;
  const jaw_round = clip(Math.abs(mid_jaw_y-gonial_y)/(Math.abs(chin_y-gonial_y)+1e-9),0,1);
  const fore_curve = clip(ang(I.BROW_LEFT,I.FOREHEAD_TOP,I.BROW_RIGHT)/Math.PI,0,1);
  const cheek_prom = clip((cheek_w-0.5*(forehead_w+jaw_w))/(cheek_w+1e-9)+0.5,0,1);
  const curv = [jaw_round,fore_curve,cheek_prom];
  const lr_asym = Math.abs(d(I.ZYGOMATIC_LEFT,I.CHIN_BOTTOM)-d(I.ZYGOMATIC_RIGHT,I.CHIN_BOTTOM))/(cheek_w+1e-9);
  const ul_bal = Math.abs(face_len*0.5-d(I.FOREHEAD_TOP,I.NOSE_TIP))/(face_len+1e-9);
  const sym = [clip(lr_asym,0,0.2),clip(ul_bal,0,0.2)];
  const chin_ang = ang(I.JAW_LEFT,I.CHIN_BOTTOM,I.JAW_RIGHT)/Math.PI;
  const cheek_ang = ang(I.ZYGOMATIC_LEFT,I.NOSE_TIP,I.ZYGOMATIC_RIGHT)/Math.PI;
  const ang_feat = [chin_ang,cheek_ang];
  const obs = {geo,curv,sym,ang:ang_feat};

  const F={}, R={};
  for (const name in obs) {
    F[name]=[]; R[name]=[];
    for (let s=0;s<SHAPES.length;s++) {
      const mu = QUANTUM_TARGETS[SHAPES[s]][name];
      const sigma = QUANTUM_SIGMA[name];
      let z2=0, rSum=0;
      for (let i=0;i<mu.length;i++) { const z=(obs[name][i]-mu[i])/sigma[i]; z2+=z*z; rSum+=z; }
      F[name].push(Math.exp(-0.5*z2));
      R[name].push(rSum/mu.length);
    }
  }
  const psiReal=new Array(SHAPES.length).fill(0);
  const psiImag=new Array(SHAPES.length).fill(0);
  for (const name in F) {
    const w=OBSERVER_WEIGHTS[name], ph=OBSERVER_PHASES[name];
    for (let s=0;s<SHAPES.length;s++) {
      const amp = w*Math.sqrt(F[name][s]);
      const total = ph + Math.atan2(R[name][s],1.0);
      psiReal[s] += amp*Math.cos(total);
      psiImag[s] += amp*Math.sin(total);
    }
  }
  let probSum=0; const prob=[];
  for (let s=0;s<SHAPES.length;s++) { const p=psiReal[s]**2+psiImag[s]**2; prob.push(p); probSum+=p; }
  for (let s=0;s<SHAPES.length;s++) prob[s]/=(probSum+1e-12);

  // coherence-like metric
  const coherence = Math.sqrt(prob.reduce((a,b)=>a+b*b,0));

  // Bayesian posterior
  let logSum=0; const logPost=[];
  for (let s=0;s<SHAPES.length;s++) {
    const lp = Math.log(prob[s]+1e-12) + 0.12*Math.log(SHAPE_PRIOR[s]+1e-12);
    logPost.push(lp); logSum+=Math.exp(lp);
  }
  const posterior = logPost.map(lp => Math.exp(lp)/logSum);

  let topIdx=0, maxProb=0;
  for (let s=0;s<SHAPES.length;s++) if (posterior[s]>maxProb) {maxProb=posterior[s]; topIdx=s;}
  const topShape = SHAPES[topIdx];

  let entropy=0;
  for (let s=0;s<SHAPES.length;s++) entropy -= posterior[s]*Math.log(posterior[s]+1e-12);
  entropy /= Math.log(SHAPES.length);

  return {
    shape: topShape, confidence: posterior[topIdx],
    scores: posterior, probabilities: prob,
    entropy, coherence,
    stability: 1 - entropy  // 0..1
  };
}

/* ===== Skin Tone + Additional Analysis ===== */
function analyzeSkinTone(imgElement) {
  // Sample cheek region (below eyes, mid-face)
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", {willReadFrequently:true});
  canvas.width = imgElement.naturalWidth || imgElement.width;
  canvas.height = imgElement.naturalHeight || imgElement.height;
  ctx.drawImage(imgElement, 0, 0);

  const cx = Math.floor(canvas.width * 0.5);
  const cy = Math.floor(canvas.height * 0.55);
  const size = Math.floor(Math.min(canvas.width, canvas.height) * 0.08);
  const data = ctx.getImageData(cx-size, cy-size, size*2, size*2).data;

  let r=0,g=0,b=0,n=0;
  for (let i=0;i<data.length;i+=4) {
    if (data[i+3] < 100) continue;
    r += data[i]; g += data[i+1]; b += data[i+2]; n++;
  }
  if (n === 0) return null;
  r/=n; g/=n; b/=n;

  // Undertone heuristic
  const warm = (r - b) / 255;
  const cool = (b - r) / 255;
  let undertone = "neutral", undertoneFa = "خنثی";
  if (warm > 0.08) { undertone="warm"; undertoneFa="گرم"; }
  else if (cool > 0.04) { undertone="cool"; undertoneFa="سرد"; }

  // Depth
  const lum = 0.299*r + 0.587*g + 0.114*b;
  let depth = "medium", depthFa = "متوسط";
  if (lum > 190) { depth="fair"; depthFa="روشن"; }
  else if (lum < 100) { depth="deep"; depthFa="تیره"; }
  else if (lum < 150) { depth="tan"; depthFa="برنزه"; }

  return {undertone, undertoneFa, depth, depthFa, rgb:[Math.round(r),Math.round(g),Math.round(b)]};
}

function recommendBeard(shape) {
  const map = {
    oval:    {name:"هر مدلی", desc:"فرم بیضی انعطاف‌پذیر است — ریش کامل، گوت، یا استایل تمیز.", icon:"🧔"},
    round:   {name:"گوت + سبیل", desc:"ریش باریک و بلند صورت را کشیده‌تر نشان می‌دهد. از ریش پرپشت پرهیز کنید.", icon:"💈"},
    square:  {name:"ریش کوتاه تمیز", desc:"خط فک را نرم کنید. ریش سه‌روزه یا کوتاه مرتب عالی است.", icon:"✨"},
    heart:   {name:"ریش کوتاه + سبیل", desc:"پرکردن ناحیه چانه تعادل ایجاد می‌کند. ریش کامل پایین مناسب است.", icon:"🎯"},
    oblong:  {name:"ریش کامل متوسط", desc:"عرض صورت را زیاد می‌کند. حجم کناره‌ها مفید است.", icon:"🌿"},
    diamond: {name:"ریش چانه‌ای", desc:"پرکردن ناحیه فک و چانه. ریش متوسط با خط فک نرم.", icon:"💎"},
    triangle:{name:"ریش کامل", desc:"تعادل با پیشانی پهن. حجم کامل روی فک و چانه.", icon:"🔻"}
  };
  return map[shape] || map.oval;
}

function recommendEyebrows(shape) {
  const map = {
    oval:"ابروی طبیعی با انحنای ملایم.",
    round:"ابروی با قوس بیشتر و ضخامت متوسط.",
    square:"ابروی نرم و کمی گرد.",
    heart:"ابروی صاف با قوس کم.",
    oblong:"ابروی صاف و پهن.",
    diamond:"ابروی با قوس ملایم و پهن.",
    triangle:"ابروی متوسط با قوس کم."
  };
  return map[shape] || map.oval;
}

/* ===== Image handling ===== */
async function setFile(f) {
  if (!f) return;
  els.errorBox.classList.remove("is-visible");
  els.loading.style.display = "none";
  stopCamera();
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = async () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(f);
      els.previewImg.src = objectUrl;
      els.preview.classList.add("is-visible");
      els.analyzeBtn.disabled = true;
      els.analyzeBtn.textContent = "🔬 تحلیل خودکار در حال اجرا...";
      setTimeout(() => runAnalysis(img), 300);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

async function runAnalysis(imgElement) {
  els.upload.style.display = "none";
  els.loading.style.display = "block";
  setStep(2);
  els.progressFill.style.width = "10%";

  try {
    if (!faceLandmarker) await initFaceLandmarker();
    els.loadingText.textContent = "در حال استخراج نقاط چهره...";
    els.progressFill.style.width = "60%";

    // Compress
    const canvas = document.createElement("canvas");
    let w = imgElement.width, h = imgElement.height;
    const maxSide = 800;
    if (w > maxSide) { h *= maxSide/w; w = maxSide; }
    if (h > maxSide) { w *= maxSide/h; h = maxSide; }
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(imgElement, 0, 0, w, h);

    const bitmap = await createImageBitmap(canvas);
    const results = faceLandmarker.detect(bitmap);

    if (!results.faceLandmarks || results.faceLandmarks.length === 0) {
      throw new Error("چهره‌ای در عکس پیدا نشد. لطفاً عکس واضح‌تری با نور خوب انتخاب کنید.");
    }
    els.progressFill.style.width = "75%";
    els.loadingText.textContent = "در حال محاسبات کوانتومی...";
    await new Promise(r => setTimeout(r, 400));

    const landmarks = results.faceLandmarks[0];
    const analysis = analyzeQuantum(landmarks);
    if (!analysis) throw new Error("محاسبه ویژگی‌های صورت ناموفق بود.");

    const skin = analyzeSkinTone(imgElement);
    const beard = recommendBeard(analysis.shape);
    const brows = recommendEyebrows(analysis.shape);

    const suitableStyles = HAIRSTYLES.filter(s => s.face_shapes.includes(analysis.shape));
    lastResult = {analysis, skin, beard, brows, styles: suitableStyles};

    els.progressFill.style.width = "100%";
    els.loadingText.textContent = "تحلیل کامل شد ✓";
    await new Promise(r => setTimeout(r, 300));

    renderResults();
    saveHistory(analysis);
    setStep(3);
    if (navigator.vibrate) navigator.vibrate([20,50,20]);

  } catch (err) {
    els.upload.style.display = "block";
    els.loading.style.display = "none";
    els.errorBox.textContent = "⚠️ خطا: " + err.message;
    els.errorBox.classList.add("is-visible");
    setStep(1);
    toast("تحلیل ناموفق بود — دوباره تلاش کنید");
  }
}

/* ===== Rendering ===== */
function renderResults() {
  const {analysis, skin, beard, brows, styles} = lastResult;
  const shapeFa = SHAPE_FA[analysis.shape];
  const shapeEn = SHAPE_EN[analysis.shape];
  const pct = Math.round(analysis.confidence*100);
  const ciLo = Math.max(0, pct-5), ciHi = Math.min(100, pct+5);
  const entPct = Math.round(analysis.entropy*100);
  const stabPct = Math.round(analysis.stability*100);
  const cohPct = Math.round(analysis.coherence*100);

  els.resultHeader.innerHTML = `
    <div class="result__shape">
      <span class="result__shape-label">فرم صورت شما</span>
      <span class="result__shape-value">${shapeFa}</span>
      <span class="result__shape-en">${shapeEn}</span>
    </div>
    <div class="conf">
      <span class="conf__bar">
        <span class="conf__ci" style="left:${ciLo}%;width:${ciHi-ciLo}%"></span>
        <span class="conf__fill" style="width:${pct}%"></span>
      </span>
      <span class="conf__pct">${pct}% اطمینان</span>
    </div>
    <div class="quantum-box">
      <div class="quantum-box__title">⚛️ سنجه‌های موتور کوانتومی</div>
      <div class="quantum-metrics">
        <div class="qm"><span class="qm__label">آنتروپی</span>
          <span class="qm__val qm__val--qu">${analysis.entropy.toFixed(3)}</span></div>
        <div class="qm"><span class="qm__label">همدوسی</span>
          <span class="qm__val qm__val--qu">${cohPct}%</span></div>
        <div class="qm"><span class="qm__label">پایداری موتور</span>
          <span class="qm__val qm__val--qu">${stabPct}%</span></div>
        <div class="qm"><span class="qm__label">عدم‌قطعیت</span>
          <span class="qm__val qm__val--qu">${entPct}%</span></div>
      </div>
    </div>
  `;

  // Probabilities bar chart
  const sorted = SHAPES.map((s,i) => ({shape:s, p:analysis.scores[i]}))
    .sort((a,b) => b.p - a.p);
  els.probsContainer.innerHTML = `
    <div class="probs">
      <div class="probs__title">
        <span>📊 توزیع احتمال فرم صورت</span>
        <small>پس از رمبش کوانتومی</small>
      </div>
      ${sorted.map(row => {
        const p = (row.p*100).toFixed(1);
        const isTop = row.shape === analysis.shape;
        return `<div class="prob-row ${isTop?'prob-row--top':''}">
          <span class="prob-row__name">${SHAPE_FA[row.shape]}</span>
          <span class="prob-row__bar"><span class="prob-row__fill" style="width:${p}%"></span></span>
          <span class="prob-row__pct">${p}%</span>
        </div>`;
      }).join("")}
    </div>
  `;

  // Info cards (skin, beard, brows)
  let infoHtml = `<div class="info-grid">`;
  if (skin) {
    infoHtml += `
      <div class="info-card">
        <div class="info-card__label">🎨 رنگ پوست</div>
        <div class="info-card__value">${skin.depthFa} · ${skin.undertoneFa}</div>
        <div class="info-card__hint">زیرتُن ${skin.undertoneFa} — رنگ موی ${skin.undertone==='warm'?'طلایی/مسی':skin.undertone==='cool'?'خاکستری/دودی':'هر رنگ'} پیشنهاد می‌شود</div>
      </div>
    `;
  }
  infoHtml += `
    <div class="info-card">
      <div class="info-card__label">${beard.icon} توصیه ریش</div>
      <div class="info-card__value">${beard.name}</div>
      <div class="info-card__hint">${beard.desc}</div>
    </div>
    <div class="info-card" style="grid-column:1/-1">
      <div class="info-card__label">👁️ ابرو</div>
      <div class="info-card__value">${brows}</div>
    </div>
  `;
  infoHtml += `</div>`;
  els.infoContainer.innerHTML = infoHtml;

  renderStyles(styles);
  els.loading.style.display = "none";
  els.result.classList.add("is-visible");
  els.analyzeBtn.textContent = "✨ تحلیل کوانتومی چهره";
}

function renderStyles(styles) {
  const filtered = styles.filter(styleMatches);
  els.styleCount.textContent = `${filtered.length} از ${styles.length}`;
  if (filtered.length === 0) {
    els.stylesList.innerHTML = `<div class="empty"><div class="empty__icon">🔍</div>با این فیلترها مدلی پیدا نشد.</div>`;
    return;
  }
  els.stylesList.innerHTML = filtered.map((s,i) => {
    const tags = [
      [LEN_FA[s.length],""], [VIBE_FA[s.vibe],""],
      [MAINT_FA[s.maintenance],"tag--maint"],
      [`سختی ${s.difficulty}/5`,"tag--diff"],
      ...s.textures.map(t => [TEX_FA[t],""])
    ].filter(t => t[0]);
    const tagsHtml = tags.map(([t,c]) => `<span class="tag ${c}">${t}</span>`).join("");
    return `
      <div class="style-card">
        <span class="style-num">${i+1}</span>
        <div class="style-body">
          <strong class="style-title">${s.name_fa}<span class="style-title-en">${s.name_en}</span></strong>
          <p class="style-desc">${s.description_fa}</p>
          ${s.why_fa ? `<p class="style-why">💡 ${s.why_fa}</p>` : ""}
          <div class="style-tags">
            ${tagsHtml}
            <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(s.name_en + " haircut")}"
               target="_blank" rel="noopener" class="tag tag--img">🔍 دیدن عکس</a>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function styleMatches(s) {
  if (prefs.length !== "all" && s.length !== prefs.length) return false;
  if (prefs.texture !== "all" && !s.textures.includes(prefs.texture)) return false;
  if (prefs.vibe !== "all" && s.vibe !== prefs.vibe) return false;
  if (prefs.maintenance !== "all" && s.maintenance !== prefs.maintenance) return false;
  return true;
}

/* ===== History ===== */
function saveHistory(analysis) {
  try {
    const arr = JSON.parse(localStorage.getItem("headline_history") || "[]");
    arr.unshift({shape:analysis.shape, conf:analysis.confidence, ts:Date.now()});
    localStorage.setItem("headline_history", JSON.stringify(arr.slice(0,10)));
    renderHistory();
  } catch {}
}
function renderHistory() {
  try {
    const arr = JSON.parse(localStorage.getItem("headline_history") || "[]");
    if (arr.length === 0) { els.history.classList.remove("is-visible"); return; }
    els.history.classList.add("is-visible");
    els.historyList.innerHTML = arr.map(h => {
      const d = new Date(h.ts);
      const dateStr = d.toLocaleDateString("fa-IR", {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
      return `<div class="history-item">
        <span class="history-item__shape">${SHAPE_FA[h.shape]} · ${Math.round(h.conf*100)}%</span>
        <span class="history-item__date">${dateStr}</span>
      </div>`;
    }).join("");
  } catch {}
}
els.historyClear.addEventListener("click", () => {
  localStorage.removeItem("headline_history");
  els.history.classList.remove("is-visible");
  toast("تاریخچه پاک شد");
});

/* ===== Camera ===== */
async function startCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width:{ideal:1280}, height:{ideal:1280} }
    });
    els.video.srcObject = cameraStream;
    await els.video.play();
    els.cameraView.classList.add("is-visible");
    els.preview.classList.remove("is-visible");
  } catch (err) {
    toast("دسترسی به دوربین ممکن نیست — از گالری استفاده کنید");
    console.warn(err);
  }
}
function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  els.cameraView.classList.remove("is-visible");
}
els.btnCamera.addEventListener("click", startCamera);
els.btnCamCancel.addEventListener("click", stopCamera);
els.btnCamCapture.addEventListener("click", () => {
  const video = els.video;
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    if (blob) {
      const f = new File([blob], "capture.jpg", {type:"image/jpeg"});
      stopCamera();
      setFile(f);
    }
  }, "image/jpeg", 0.9);
});

/* ===== Share & Save ===== */
els.btnShare.addEventListener("click", async () => {
  if (!lastResult) return;
  const {analysis, skin, beard, styles} = lastResult;
  const top3 = styles.slice(0,3).map(s => "• " + s.name_fa + " (" + s.name_en + ")").join("\n");
  const text = `🎯 فرم صورت من: ${SHAPE_FA[analysis.shape]} (${Math.round(analysis.confidence*100)}% اطمینان)
${skin ? `🎨 رنگ پوست: ${skin.depthFa} · ${skin.undertoneFa}` : ""}
${beard.icon} توصیه ریش: ${beard.name}
📋 پیشنهادهای هد لاین:\n${top3}\n\n— تحلیل توسط HEADLINE Pro v6.0`;
  if (navigator.share) {
    try { await navigator.share({title:"تحلیل هد لاین", text}); return; } catch {}
  }
  try {
    await navigator.clipboard.writeText(text);
    toast("✓ متن تحلیل کپی شد");
  } catch { toast("اشتراک‌گذاری پشتیبانی نمی‌شود"); }
});

els.btnSave.addEventListener("click", () => {
  if (!lastResult) return;
  const {analysis, skin, beard, brows, styles} = lastResult;
  const data = {
    timestamp: new Date().toISOString(),
    face_shape: analysis.shape,
    confidence: analysis.confidence,
    quantum_metrics: {entropy: analysis.entropy, coherence: analysis.coherence, stability: analysis.stability},
    probabilities: SHAPES.reduce((a,s,i) => (a[s]=analysis.scores[i], a), {}),
    skin, beard, brows,
    recommendations: styles.map(s => ({fa:s.name_fa, en:s.name_en, difficulty:s.difficulty}))
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `headline-analysis-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("✓ نتیجه ذخیره شد");
});

/* ===== Events ===== */
els.galleryInput.addEventListener("change", e => setFile(e.target.files?.[0]));
els.removeBtn.addEventListener("click", () => {
  els.preview.classList.remove("is-visible");
  els.previewImg.src = "";
  selectedFile = null;
  els.analyzeBtn.textContent = "✨ تحلیل کوانتومی چهره";
});
els.analyzeBtn.addEventListener("click", () => {
  if (els.previewImg.src && els.previewImg.complete) runAnalysis(els.previewImg);
});
els.restartBtn.addEventListener("click", () => {
  els.result.classList.remove("is-visible");
  els.upload.style.display = "block";
  els.preview.classList.remove("is-visible");
  els.previewImg.src = "";
  els.loading.style.display = "none";
  els.errorBox.classList.remove("is-visible");
  selectedFile = null;
  lastResult = null;
  els.analyzeBtn.textContent = "✨ تحلیل کوانتومی چهره";
  els.analyzeBtn.disabled = true;
  els.progressFill.style.width = "0%";
  setStep(1);
  renderHistory();
});

els.prefs.querySelectorAll(".chips").forEach(chipsEl => {
  const key = chipsEl.dataset.pref;
  chipsEl.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    chipsEl.querySelectorAll(".chip").forEach(c => c.classList.remove("chip--active"));
    btn.classList.add("chip--active");
    prefs[key] = btn.dataset.val;
    if (lastResult) renderStyles(lastResult.styles);
  });
});

/* ===== Init ===== */
renderHistory();
initFaceLandmarker().catch(err => {
  console.warn("MediaPipe init failed:", err);
  toast("آماده‌سازی موتور ممکن نشد — دوباره تلاش کنید");
});
</script>
